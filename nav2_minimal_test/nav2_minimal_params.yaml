bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: amr1/base_link
    odom_topic: /amr1/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /amr1/odom
    enable_stamped_cmd_vel: false

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ROS 2 Jazzy RPP parameter name
      desired_linear_vel: 0.70

      lookahead_dist: 0.50
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.80
      lookahead_time: 1.5

      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.30

      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.50

      # 이번 최소 테스트에서는 센서/장애물 회피를 사용하지 않는다.
      use_collision_detection: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false

      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.10

      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: amr1/odom
      robot_base_frame: amr1/base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      robot_radius: 0.35
      track_unknown_space: false
      transform_tolerance: 0.5

      # 센서 없는 최소 테스트:
      # 장애물/정적 지도 layer를 사용하지 않고 빈 costmap을 사용한다.
      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: amr1/base_link

      update_frequency: 2.0
      publish_frequency: 1.0

      # map_server 없이도 동작시키기 위한 rolling global costmap
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05

      robot_radius: 0.35
      track_unknown_space: false
      transform_tolerance: 0.5

      # 실제 공장 map / scan은 다음 단계에서 붙인다.
      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.30
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0
    local_frame: amr1/odom
    global_frame: map
    robot_base_frame: amr1/base_link
    transform_tolerance: 0.5

    enable_stamped_cmd_vel: false

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
